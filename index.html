<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101426"><title>XO | لعبة إكس أو</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0c1020;--panel:#171d33;--line:#293451;--text:#f4f6ff;--muted:#9ba7c4;--cyan:#50e5df;--pink:#ff75ad;--gold:#ffd477}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Cairo,system-ui,sans-serif;background:radial-gradient(ellipse at 15% 10%,#20365a 0,transparent 36%),radial-gradient(ellipse at 90% 85%,#392044 0,transparent 32%),var(--bg);color:var(--text);display:grid;place-items:center;padding:22px}.app{width:min(100%,520px)}header{text-align:center;margin-bottom:22px}.logo{font-size:clamp(42px,10vw,62px);font-weight:900;letter-spacing:5px;background:linear-gradient(90deg,var(--cyan),#fff,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}h1{font-size:22px;margin:8px 0 2px}header p{color:var(--muted);margin:0;font-size:14px}.panel{background:#151c31ef;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 22px 70px #0006;backdrop-filter:blur(14px)}.modes{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}.mode,button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:13px;padding:11px 12px;color:var(--text);background:#202943;transition:.18s}.mode.active{background:linear-gradient(120deg,#164d59,#293b5d);border-color:var(--cyan)}.mode:hover,button:hover{transform:translateY(-1px);filter:brightness(1.12)}.scoreboard{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:17px}.score{background:#0e1528;border:1px solid var(--line);border-radius:15px;text-align:center;padding:10px 4px}.score strong{display:block;font-size:25px}.score span{font-size:12px;color:var(--muted)}.x{color:var(--cyan)}.o{color:var(--pink)}.draw{color:var(--gold)}.status{text-align:center;font-weight:800;font-size:17px;margin:8px 0 15px;min-height:30px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:390px;margin:auto}.cell{aspect-ratio:1;border-radius:18px;background:linear-gradient(145deg,#202b47,#151d32);border:1px solid #34415f;font-size:clamp(42px,12vw,64px);font-weight:900;display:grid;place-items:center;user-select:none}.cell:disabled{cursor:default;opacity:1}.cell.playable:hover{border-color:#6a8aa8;background:#263653}.mark-x{color:var(--cyan);text-shadow:0 0 22px #50e5df55}.mark-o{color:var(--pink);text-shadow:0 0 22px #ff75ad55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.primary{background:linear-gradient(110deg,#087f88,#3456a0);border:0;font-weight:800}.secondary{background:#222b43}.hint{text-align:center;color:var(--muted);font-size:12px;margin:15px 0 0}@media(max-width:390px){body{padding:13px}.panel{padding:14px}.board{gap:7px}.cell{border-radius:14px}}
</style></head><body><main class="app"><header><div class="logo">X O</div><h1>لعبة إكس أو</h1><p>تحدّى صديقك أو جرّب حظك ضد الكمبيوتر</p></header><section class="panel"><div class="modes"><button class="mode active" id="two">👥 لاعبان</button><button class="mode" id="cpu">🤖 ضد الكمبيوتر</button></div><div class="scoreboard"><div class="score"><strong class="x" id="scoreX">0</strong><span>اللاعب X</span></div><div class="score"><strong class="draw" id="scoreD">0</strong><span>تعادل</span></div><div class="score"><strong class="o" id="scoreO">0</strong><span id="labelO">اللاعب O</span></div></div><div class="status" id="status" aria-live="polite">دور اللاعب X</div><div class="board" id="board" aria-label="لوحة لعبة إكس أو"></div><div class="actions"><button class="primary" id="newRound">جولة جديدة ↻</button><button class="secondary" id="reset">تصفير النتائج</button></div><p class="hint">اختار خانة فاضية عشان تلعب. أول واحد يكوّن 3 علامات متتالية يكسب.</p></section></main>
<script>
const boardEl=document.getElementById('board'),statusEl=document.getElementById('status');let cells=Array(9).fill(''),turn='X',mode='two',ended=false,scores={X:0,O:0,D:0};const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function render(){boardEl.innerHTML='';cells.forEach((v,i)=>{const b=document.createElement('button');b.className='cell'+(!v&&!ended?' playable':'');b.disabled=!!v||ended||(mode==='cpu'&&turn==='O');b.setAttribute('aria-label',v?('الخانة '+(i+1)+': '+v):('الخانة '+(i+1)+' فارغة'));if(v){const s=document.createElement('span');s.className=v==='X'?'mark-x':'mark-o';s.textContent=v;b.append(s)}b.addEventListener('click',()=>play(i));boardEl.append(b)});document.getElementById('scoreX').textContent=scores.X;document.getElementById('scoreO').textContent=scores.O;document.getElementById('scoreD').textContent=scores.D}
function winner(){return wins.find(line=>line.every(i=>cells[i]&&cells[i]===cells[line[0]]))}
function play(i){if(cells[i]||ended)return;cells[i]=turn;const line=winner();if(line){ended=true;scores[turn]++;statusEl.textContent=turn==='X'?'🎉 اللاعب X كسب الجولة!':(mode==='cpu'?'🤖 الكمبيوتر كسب الجولة!':'🎉 اللاعب O كسب الجولة!')}else if(cells.every(Boolean)){ended=true;scores.D++;statusEl.textContent='🤝 تعادل! جولة قوية'}else{turn=turn==='X'?'O':'X';statusEl.textContent=mode==='cpu'&&turn==='O'?'دور الكمبيوتر...':'دور اللاعب '+turn}render();if(mode==='cpu'&&turn==='O'&&!ended)setTimeout(cpuMove,420)}
function findMove(mark){for(const line of wins){const vals=line.map(i=>cells[i]);if(vals.filter(v=>v===mark).length===2&&vals.filter(v=>!v).length===1)return line[vals.indexOf('')]}return null}
function cpuMove(){if(ended||mode!=='cpu')return;let move=findMove('O');if(move===null)move=findMove('X');if(move===null){if(!cells[4])move=4;else{const corners=[0,2,6,8].filter(i=>!cells[i]);move=corners[Math.floor(Math.random()*corners.length)]??cells.findIndex(v=>!v)}}if(move>=0)play(move)}
function newRound(){cells=Array(9).fill('');turn='X';ended=false;statusEl.textContent='دور اللاعب X';render()}
function setMode(next){mode=next;document.getElementById('two').classList.toggle('active',mode==='two');document.getElementById('cpu').classList.toggle('active',mode==='cpu');document.getElementById('labelO').textContent=mode==='cpu'?'الكمبيوتر O':'اللاعب O';scores={X:0,O:0,D:0};newRound()}
document.getElementById('two').onclick=()=>setMode('two');document.getElementById('cpu').onclick=()=>setMode('cpu');document.getElementById('newRound').onclick=newRound;document.getElementById('reset').onclick=()=>{scores={X:0,O:0,D:0};newRound()};render();
</script></body></html>
